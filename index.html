html = """<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EV Rental Pro Ultimate</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

:root{

 --primary:#0f9d8d;

 --dark:#0f172a;

 --light:#ffffff;

 --bg:#f3f6fb;

 --border:#dbe4ee;

}

*{box-sizing:border-box}

body{

 margin:0;

 font-family:Arial,sans-serif;

 background:var(--bg);

 color:#111827;

}

header{

 background:linear-gradient(135deg,#0f9d8d,#2563eb);

 color:white;

 padding:22px;

 position:sticky;

 top:0;

 z-index:100;

 box-shadow:0 4px 20px rgba(0,0,0,.15);

}

.container{

 max-width:1300px;

 margin:auto;

 padding:20px;

}

.hero{

 background:white;

 border-radius:24px;

 padding:30px;

 margin-bottom:24px;

 box-shadow:0 10px 30px rgba(0,0,0,.06);

}

.grid{

 display:grid;

 grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

 gap:20px;

}

.card{

 background:white;

 border-radius:20px;

 overflow:hidden;

 box-shadow:0 10px 25px rgba(0,0,0,.07);

 transition:.25s;

}

.card:hover{

 transform:translateY(-4px);

}

.card img{

 width:100%;

 height:220px;

 object-fit:cover;

}

.card-body{

 padding:18px;

}

.price{

 font-size:28px;

 font-weight:bold;

 color:var(--primary);

}

.btn{

 border:none;

 border-radius:12px;

 padding:12px 16px;

 cursor:pointer;

 font-weight:bold;

}

.btn-primary{

 background:linear-gradient(135deg,#0f9d8d,#2563eb);

 color:white;

}

.btn-danger{

 background:#ef4444;

 color:white;

}

.form-box{

 background:white;

 border-radius:20px;

 padding:20px;

 margin-bottom:24px;

 box-shadow:0 10px 25px rgba(0,0,0,.06);

}

input,select{

 width:100%;

 padding:12px;

 border-radius:12px;

 border:1px solid var(--border);

 margin-top:10px;

}

.toast{

 position:fixed;

 bottom:20px;

 right:20px;

 background:#111827;

 color:white;

 padding:14px 18px;

 border-radius:12px;

 display:none;

 z-index:9999;

}

.admin{

 background:white;

 padding:20px;

 border-radius:20px;

 margin-top:30px;

 box-shadow:0 10px 25px rgba(0,0,0,.06);

}

.badge{

 background:#dcfce7;

 color:#166534;

 padding:6px 10px;

 border-radius:999px;

 font-size:12px;

 font-weight:bold;

}

.topbar{

 display:flex;

 justify-content:space-between;

 align-items:center;

 gap:10px;

 flex-wrap:wrap;

}

.booking-box{

 background:#f8fafc;

 border-radius:14px;

 padding:14px;

 margin-top:14px;

 border:1px solid var(--border);

}

</style>

</head>

<body>

<header>

<div class="topbar">

<div>

<h1><i class="fa-solid fa-car-side"></i> EV Rental Pro Ultimate</h1>

<div>ระบบเช่ารถไฟฟ้าครบวงจร</div>

</div>

<div id="user-info">

ยังไม่ได้เข้าสู่ระบบ

</div>

</div>

</header>

<div class="container">

<div class="hero">

<h2>เช่ารถไฟฟ้าพรีเมียม</h2>

<p>ระบบจองรถออนไลน์ พร้อมสมาชิก โปรโมชั่น และแอดมิน</p>

</div>

<div class="form-box">

<h2>สมัครสมาชิก</h2>

<input id="reg-name" placeholder="ชื่อ">

<input id="reg-phone" placeholder="เบอร์โทร">

<input id="reg-pass" type="password" placeholder="รหัสผ่าน">

<button class="btn btn-primary" onclick="register()" style="margin-top:12px;">

สมัครสมาชิก

</button>

</div>

<div class="form-box">

<h2>เข้าสู่ระบบ</h2>

<input id="login-phone" placeholder="เบอร์โทร">

<input id="login-pass" type="password" placeholder="รหัสผ่าน">

<button class="btn btn-primary" onclick="login()" style="margin-top:12px;">

เข้าสู่ระบบ

</button>

</div>

<h2>รถทั้งหมด</h2>

<div class="grid" id="car-grid"></div>

<div class="admin">

<h2>ระบบจัดการ Admin</h2>

<div id="booking-list"></div>

</div>

</div>

<div class="toast" id="toast"></div>

<script>

const app = {

 currentUser:null,

 users: JSON.parse(localStorage.getItem('users') || '[]'),

 bookings: JSON.parse(localStorage.getItem('bookings') || '[]'),

 cars:[

  {

   id:1,

   name:'Tesla Model 3',

   price:2500,

   range:580,

   seats:5,

   type:'EV',

   status:'Available',

   image:'https://images.unsplash.com/photo-1560958089-b8a1929cea89?q=80&w=1200&auto=format&fit=crop'

  },

  {

   id:2,

   name:'BYD Seal',

   price:2200,

   range:650,

   seats:5,

   type:'EV',

   status:'Available',

   image:'https://images.unsplash.com/photo-1553440569-bcc63803a83d?q=80&w=1200&auto=format&fit=crop'

  },

  {

   id:3,

   name:'BMW i7',

   price:4200,

   range:625,

   seats:5,

   type:'Luxury EV',

   status:'Available',

   image:'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1200&auto=format&fit=crop'

  }

 ]

};

function saveData(){

 localStorage.setItem('users',JSON.stringify(app.users));

 localStorage.setItem('bookings',JSON.stringify(app.bookings));

}

function toast(msg){

 const el = document.getElementById('toast');

 el.innerText = msg;

 el.style.display = 'block';

 setTimeout(()=>{

  el.style.display='none';

 },2500);

}

function register(){

 const name = document.getElementById('reg-name').value.trim();

 const phone = document.getElementById('reg-phone').value.trim();

 const pass = document.getElementById('reg-pass').value.trim();

 if(!name || !phone || !pass){

  return toast('กรุณากรอกข้อมูลให้ครบ');

 }

 const exist = app.users.find(u=>u.phone===phone);

 if(exist){

  return toast('เบอร์นี้มีบัญชีแล้ว');

 }

 const user = {

  id:Date.now(),

  name,

  phone,

  password:pass,

  role: app.users.length===0 ? 'admin_master' : 'user',

  points:100

 };

 app.users.push(user);

 saveData();

 toast('สมัครสมาชิกสำเร็จ');

}

function login(){

 const phone = document.getElementById('login-phone').value.trim();

 const pass = document.getElementById('login-pass').value.trim();

 const user = app.users.find(u=>u.phone===phone);

 if(!user){

  return toast('ไม่พบบัญชี');

 }

 if(user.password !== pass){

  return toast('รหัสผ่านผิด');

 }

 app.currentUser = user;

 document.getElementById('user-info').innerHTML = `

  <b>${user.name}</b><br>

  <span class="badge">${user.role}</span>

 `;

 toast('เข้าสู่ระบบสำเร็จ');

}

function renderCars(){

 const grid = document.getElementById('car-grid');

 grid.innerHTML = app.cars.map(car=>`

 <div class="card">

  <img src="${car.image}">

  <div class="card-body">

   <div style="display:flex;justify-content:space-between;align-items:center;">

    <h3>${car.name}</h3>

    <span class="badge">${car.type}</span>

   </div>

   <p><i class="fa-solid fa-battery-full"></i> ${car.range} km</p>

   <p><i class="fa-solid fa-users"></i> ${car.seats} ที่นั่ง</p>

   <div class="price">

    ฿${car.price}/วัน

   </div>

   <div style="margin-top:16px;display:flex;gap:10px;">

    <button class="btn btn-primary" onclick="bookCar(${car.id})">

      จองรถ

    </button>

    <button class="btn" onclick="viewCar(${car.id})">

      ดูรายละเอียด

    </button>

   </div>

  </div>

 </div>

 `).join('');

}

function viewCar(id){

 const car = app.cars.find(c=>c.id===id);

 alert(

  car.name + "\\n" +

  "ราคา: ฿" + car.price + "/วัน\\n" +

  "ระยะทาง: " + car.range + " km"

 );

}

function bookCar(carId){

 if(!app.currentUser){

  return toast('กรุณาเข้าสู่ระบบก่อน');

 }

 const car = app.cars.find(c=>c.id===carId);

 const booking = {

  id:'BK'+Date.now(),

  carId:car.id,

  carName:car.name,

  user:app.currentUser.name,

  total:car.price,

  status:'Pending',

  createdAt:new Date().toLocaleString('th-TH')

 };

 app.bookings.push(booking);

 saveData();

 renderBookings();

 toast('จองรถสำเร็จ');

}

function renderBookings(){

 const box = document.getElementById('booking-list');

 if(app.bookings.length===0){

  box.innerHTML = '<p>ยังไม่มีรายการจอง</p>';

  return;

 }

 box.innerHTML = app.bookings.map(b=>`

 <div class="booking-box">

  <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">

   <div>

    <b>${b.carName}</b><br>

    ลูกค้า: ${b.user}<br>

    ยอด: ฿${b.total}

   </div>

   <div>

    <span class="badge">${b.status}</span>

   </div>

  </div>

 </div>

 `).join('');

}

renderCars();

renderBookings();

</script>

</body>

</html>
